<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyNote — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene" aria-hidden="true"><div class="sky"></div><div class="clouds"><i></i><i></i><i></i></div><div class="fx"></div></div>
<header>
  <a class="brand" href="./"><svg viewBox="0 0 24 24" width="26" height="26"><circle cx="9" cy="9" r="4" fill="#ffd27a"/><path d="M7 20a4 4 0 0 1 0-8 5 5 0 0 1 9.600-1A4.500 4.500 0 0 1 17 20z" fill="#cfe0f5"/></svg><span class="brand-name">SkyNote</span></a>
  <form id="search" role="search"><input id="q" type="search" placeholder="Search city" aria-label="Search city" autocomplete="off"><button class="btn">Search</button>
    <ul id="results" hidden></ul></form>
  <button class="btn ghost" id="geo" title="Use my location">Locate me</button>
  <button class="btn ghost" id="unit" aria-label="Switch temperature unit">°C</button>
  <button class="btn ghost" id="openSettings">Settings</button>
</header>
<main>
  <p id="error" role="alert" hidden></p>
  <nav id="saved" aria-label="Saved locations"></nav>
  <section class="hero card" aria-live="polite">
    <div><h1 id="place">—</h1><p id="time" class="muted"></p>
      <div class="temp"><span id="temp">--</span><span id="ico"></span></div>
      <p id="cond" class="cond"></p>
      <p class="muted" id="range"></p>
      <button class="btn ghost" id="fav">Save location</button></div>
    <div class="mascot"><p id="bubble" class="bubble"></p><div id="cat"></div></div>
  </section>
  <section class="grid" id="details" aria-label="Details"></section>
  <h2>Next hours</h2>
  <section class="scroller card" id="hourly"></section>
  <button class="btn ghost" id="more">Show 24 more hours</button>
  <h2>7-day forecast</h2>
  <section class="days" id="daily"></section>
</main>
<dialog id="settings"><form method="dialog"><h2>Settings</h2>
  <label>Temperature unit <select id="sUnit"><option value="c">Celsius (°C)</option><option value="f">Fahrenheit (°F)</option></select></label>
  <label class="row"><input type="checkbox" id="sMotion"> Animated weather scene</label>
  <p class="muted">Remove saved locations with the × on each chip.</p>
  <button class="btn">Done</button></form></dialog>
<footer class="muted">Weather data by <a href="https://open-meteo.com/">Open-Meteo</a>.</footer>
<script src="script.js"></script>
</body>
</html>
